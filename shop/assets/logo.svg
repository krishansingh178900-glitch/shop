<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E08F" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <linearGradient id="goldGradSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA820A" />
      <stop offset="50%" stop-color="#F5E08F" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Monogram Crest -->
  <g transform="translate(10, 10)">
    <!-- Outer Diamond -->
    <polygon points="30,2 58,30 30,58 2,30" stroke="url(#goldGrad)" stroke-width="1.8" fill="rgba(212, 175, 55, 0.05)" />
    <!-- Inner Diamond -->
    <polygon points="30,8 52,30 30,52 8,30" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 2" fill="none" opacity="0.7" />
    <!-- Center Stylized 'S' Monogram -->
    <path d="M 37 20 C 37 16, 23 16, 23 23 C 23 29, 37 28, 37 36 C 37 44, 22 43, 21 38" 
          stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow)" />
    <!-- Sparkle Accents -->
    <circle cx="30" cy="4" r="1.5" fill="#FFF4D0" />
    <circle cx="30" cy="56" r="1.5" fill="#FFF4D0" />
    <circle cx="4" cy="30" r="1.5" fill="#FFF4D0" />
    <circle cx="56" cy="30" r="1.5" fill="#FFF4D0" />
  </g>

  <!-- Brand Typography -->
  <text x="78" y="42" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', serif" font-size="28" font-weight="700" letter-spacing="6" fill="url(#goldGrad)">SKYLIX</text>
  
  <!-- Sub-label -->
  <text x="80" y="58" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="7.5" font-weight="500" letter-spacing="3.2" fill="#E2D9C8" opacity="0.85">HAUTE COIFFURE &amp; SALON</text>

  <!-- Elegant accent line -->
  <line x1="80" y1="64" x2="280" y2="64" stroke="url(#goldGradSoft)" stroke-width="0.75" opacity="0.6" />
</svg>
